version: 2

# Weekly update PRs. Their CI runs on GitHub-hosted runners and needs no secrets
# (ci.yml only uses the read-only GITHUB_TOKEN). Minor + patch updates are grouped into one PR per
# ecosystem; major updates arrive as separate PRs unless ignored below.
# cooldown: a new version is only proposed after it has been public for a few days (less exposure to
# freshly published, compromised packages).
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml) at the repository root
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js runtime (node:24 images, engines >=24): upgrade together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler) needs a deliberate migration test with Next.js and the tooling.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ioredis 6 switches to RESP3 by default: seat locks, queue, rate limits, pub/sub and BullMQ
      # must be re-verified first.
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      # Server/test libraries are independent of the Android SDK level.
      gradle-libraries:
        patterns: ['io.ktor:*', 'org.robolectric:*']
        update-types: [minor, patch]
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      # One PR for all workflow actions (majors included); SHA pins are kept by Dependabot.
      actions:
        patterns: ['*']

  - package-ecosystem: docker # Dockerfile (node:*-alpine)
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # The Node.js major is the runtime of all services: upgrade by hand together with @types/node.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose # base images (postgres, redis, minio, caddy)
    directories: ['/', '/deploy']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns: ['*']
    ignore:
      # Server data directory / pg_dump 18 are tied to PostgreSQL 18 (see Dockerfile): upgrade by hand.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
