name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe your situation (for example "we need X for our box office").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is useful for ticketing in general, not only for my organisation.
        - label: I could help test it.
