name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual start (Actions tab → CI → "Run workflow", or `gh workflow run CI --ref main`).
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (default - the triggering ref)
        type: string
        default: ''

# Cancel superseded runs of the same branch / PR (never cancels release runs: they use their own group).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, format, tests
    # Fork PRs run only on GitHub-hosted runners (no CI_RUNS_ON override): on a self-hosted runner they
    # would execute foreign code (see docs/RELEASES.md).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.CI_RUNS_ON == '' }}
    runs-on: ${{ (vars.CI_RUNS_ON != '' && github.actor != 'dependabot[bot]') && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      TIX_CI_PG: tix-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
      TIX_CI_REDIS: tix-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # PostgreSQL and Redis run as plain docker containers with unique names and EPHEMERAL host
      # ports (127.0.0.1 only): nothing clashes with services already running on the runner host.
      # The integration tests open many connections, hence max_connections above the default.
      - name: Start PostgreSQL 18 and Redis 8
        run: |
          docker run -d --name "$TIX_CI_PG" -p 127.0.0.1::5432             -e POSTGRES_PASSWORD=postgres -e TZ=UTC             postgres:18-alpine postgres -c max_connections=500
          docker run -d --name "$TIX_CI_REDIS" -p 127.0.0.1::6379 redis:8-alpine

          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$TIX_CI_PG" pg_isready -h 127.0.0.1 -U postgres               && [ "$(docker exec "$TIX_CI_REDIS" redis-cli ping 2>/dev/null)" = "PONG" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs "$TIX_CI_PG" || true
            docker logs "$TIX_CI_REDIS" || true
            exit 1
          fi

          pg_port=$(docker port "$TIX_CI_PG" 5432/tcp | head -n 1 | sed 's/.*://')
          redis_port=$(docker port "$TIX_CI_REDIS" 6379/tcp | head -n 1 | sed 's/.*://')
          url="postgres://postgres:postgres@127.0.0.1:${pg_port}/postgres"
          {
            echo "TEST_DATABASE_URL=$url"
            echo "DATABASE_URL=$url"
            echo "BACKUP_TEST_DATABASE_URL=$url"
            echo "REDIS_URL=redis://127.0.0.1:${redis_port}/0"
          } >> "$GITHUB_ENV"

      # pg_dump / pg_restore / psql 18 for the backup integration tests (must match the server
      # major). No package installation (no sudo): small wrappers run the tools from the postgres:18
      # image. The tests pass only stdin/stdout streams and PG* environment variables, which are
      # forwarded; --network host makes 127.0.0.1:<ephemeral port> reachable from the container.
      - name: PostgreSQL 18 client tools (docker wrappers)
        run: |
          docker pull postgres:18
          mkdir -p "$RUNNER_TEMP/bin"
          for tool in pg_dump pg_restore psql; do
            cat > "$RUNNER_TEMP/bin/$tool" <<EOF
          #!/bin/sh
          exec docker run --rm -i --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGAPPNAME -e PGSSLMODE \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -v /tmp:/tmp -v "\$PWD:\$PWD" -w "\$PWD" \
            postgres:18 $tool "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/bin/$tool"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Node first (tool cache in the runner directory, user-writable), then corepack for pnpm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm (corepack)
        run: corepack enable pnpm

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/release/set-version.mjs --check

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Release scripts (channel tags)
        run: node --test scripts/release/*.test.mjs

      # `docker compose config` only resolves the files; it starts nothing and touches no project.
      - name: Deploy compose matches the base compose
        run: node scripts/release/deploy-bundle.mjs --check

      - name: Remove test containers
        if: always()
        run: docker rm -f "$TIX_CI_PG" "$TIX_CI_REDIS" || true

  android:
    name: Android (unit tests, lint, debug build)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.CI_RUNS_ON == '' }}
    runs-on: ${{ (vars.CI_RUNS_ON != '' && github.actor != 'dependabot[bot]') && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default ('tools platform-tools') fails: the legacy 'tools' package no longer exists.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
