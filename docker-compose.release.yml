# Run the published release images instead of building from source:
#
#   export TIX_IMAGE_OWNER=<github-owner-of-the-repository, lower case>
#   export TIX_IMAGE_TAG=1.0.0-alpha.1          # a release version (see docs/RELEASES.md)
#   docker compose -f docker-compose.yml -f docker-compose.release.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --no-build
#
# (or put both variables into .env). `migrate` runs on the worker image, as in docker-compose.yml.

services:
  migrate:
    image: ghcr.io/${TIX_IMAGE_OWNER:?set TIX_IMAGE_OWNER}/tix-worker:${TIX_IMAGE_TAG:?set TIX_IMAGE_TAG}
    pull_policy: always
  worker:
    image: ghcr.io/${TIX_IMAGE_OWNER:?set TIX_IMAGE_OWNER}/tix-worker:${TIX_IMAGE_TAG:?set TIX_IMAGE_TAG}
    pull_policy: always
  web:
    image: ghcr.io/${TIX_IMAGE_OWNER:?set TIX_IMAGE_OWNER}/tix-web:${TIX_IMAGE_TAG:?set TIX_IMAGE_TAG}
    pull_policy: always
  realtime:
    image: ghcr.io/${TIX_IMAGE_OWNER:?set TIX_IMAGE_OWNER}/tix-realtime:${TIX_IMAGE_TAG:?set TIX_IMAGE_TAG}
    pull_policy: always
