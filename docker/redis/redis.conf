# Redis configuration for seat locks, waiting room state, rate limits and BullMQ.
# The password is passed via --requirepass from docker-compose (REDIS_PASSWORD).

bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 300
timeout 0

# Seat locks and queued jobs must NEVER be evicted. When maxmemory is reached, writes fail
# loudly (HTTP 503) instead of silently dropping locks. Required by BullMQ.
maxmemory-policy noeviction

# Durability: AOF with per-second fsync (≤1 s of lock/queue state lost on crash).
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
# A crash or power loss can leave a partially written command at the end of the AOF. Redis then
# refuses to start ("Bad file format reading the append only file"). Up to 4 KB of corrupt tail are
# discarded automatically (that write was never acknowledged anyway); larger damage still stops the
# start so it is not silently lost (repair: redis-check-aof --fix, see docs/INSTALL.md).
aof-load-truncated yes
aof-load-corrupt-tail-max-size 4096
save 900 1 300 100 60 10000

# Expired-key notifications let the seat-lock sweeper react quickly to TTL expiry
# (the sorted-set sweep remains the source of truth, notifications are best-effort).
notify-keyspace-events Ex

# Lazy freeing keeps latency flat under high key churn (thousands of expiring locks).
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes
latency-monitor-threshold 100
slowlog-log-slower-than 10000
