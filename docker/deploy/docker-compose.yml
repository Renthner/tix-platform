# TIX Platform - docker-compose.yml (release __TIX_VERSION__)
#
# Three services: the application (`tix`: shop, admin, realtime gateway and background worker in one
# image), PostgreSQL and Redis. Files (uploads, invoices, tickets, local backups) live in the
# volume `tix-data`. TLS is not part of the image: put your own reverse proxy in front (see the
# install guide); the default port is plain HTTP on 8080.
# Requires Docker Compose >= 2.23.1 (`docker compose version`).
#
# Setup (two files from the release page: docker-compose.yml and env.example):
#   1. Save env.example as .env next to this file and fill in the three required values.
#   2. docker compose up -d
#   3. docker compose run --rm tix create-admin --email you@example.org --name "Your Name"
#
# Install guide: __TIX_INSTALL_GUIDE__

# MAINTAINER-BEGIN
# Maintainer notes (stripped from the generated release file by scripts/release/deploy-bundle.mjs):
# docker/deploy/docker-compose.yml is a TEMPLATE. TIX_IMAGE_OWNER_DEFAULT is replaced by the repository
# owner and __TIX_VERSION__ / __TIX_INSTALL_GUIDE__ at build time. `node scripts/release/deploy-bundle.mjs
# --check` (CI) validates the template and docker/deploy/docker-compose.s3.example.yml. Keep the compose
# simple: no embedded configs, no anchors, no helper services.
# MAINTAINER-END

name: ${COMPOSE_PROJECT_NAME:-tix}

services:
  tix:
    # TIX_VERSION: a channel (stable, next, 1, 1.0) or an exact version, set in .env. The message
    # below shows when .env still comes from the three-image layout (it has TIX_CHANNEL instead).
    image: ghcr.io/TIX_IMAGE_OWNER_DEFAULT/tix:${TIX_VERSION:?set TIX_VERSION in .env - upgrading from the three-image layout (tix-web / tix-worker / tix-realtime)? Do NOT continue, read docs/MIGRATE-SINGLE-IMAGE.md first}
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Everything else in .env (optional settings such as LOG_LEVEL or the S3_* variables) is passed on.
    env_file: .env
    environment:
      APP_URL: '${APP_URL:?set APP_URL in .env (a .env of the three-image layout? read docs/MIGRATE-SINGLE-IMAGE.md first)}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_ENCRYPTION_KEYS: '${APP_ENCRYPTION_KEYS:?set APP_ENCRYPTION_KEYS in .env - create one with: docker run --rm ghcr.io/TIX_IMAGE_OWNER_DEFAULT/tix:__TIX_VERSION__ keygen}'
      # Empty = no proxy is trusted: every visitor then appears with the address of your reverse proxy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Shown in the admin: update notice (channel) and the version of this file.
      TIX_CHANNEL: ${TIX_VERSION}
      TIX_COMPOSE_VERSION: __TIX_VERSION__
    ports:
      - ${HTTP_PORT:-8080}:8080
    # Optional memory limit (not set by default, so nothing changes for running installations).
    # The supervisor reads the container limit (cgroup) at start and warns when TIX_WEB_PROCESSES x
    # WEB_MAX_OLD_SPACE_MB (+ worker 1024 + realtime 256) does not fit. Recommended: at least 2g for
    # one web process, 1g more per additional web process; see "Memory limit" in the install guide.
    # mem_limit: ${TIX_MEM_LIMIT:-2g}
    volumes:
      - tix-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: tix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tix
      TZ: UTC
    # PostgreSQL 18 images keep PGDATA in a versioned sub-directory of this mount point.
    volumes:
      - postgres-data:/var/lib/postgresql
    # Runtime flags only (they do not touch the data directory, so this is safe for existing
    # installations): lock waits, deadlocks and slow statements show up in `docker compose logs
    # postgres`. max_connections stays at PostgreSQL's default of 100, which the application budget
    # (TIX_DB_CONNECTION_BUDGET, default 90) is sized for; raise both together.
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100} -c log_lock_waits=on -c deadlock_timeout=1s -c log_min_duration_statement=500 -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tix -d tix']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  redis:
    # >= 8.4 is required for aof-load-corrupt-tail-max-size. Redis cannot read data written by a
    # newer version: never lower this tag on an installation that already ran.
    image: redis:8.10-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Seat locks and queued jobs must never be evicted (noeviction); AOF keeps them across restarts
    # and the corrupt-tail setting lets Redis start again after a power loss. maxmemory is a safety
    # ceiling (REDIS_MAXMEMORY in .env): when it is reached Redis refuses writes instead of growing
    # until the host runs out of memory (see "Redis memory" in the install guide).
    command: redis-server --appendonly yes --appendfsync everysec --aof-load-corrupt-tail-max-size 4096 --maxmemory-policy noeviction --maxmemory ${REDIS_MAXMEMORY:-1gb}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  tix-data:
  postgres-data:
  redis-data:
