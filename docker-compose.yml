# Development / from-source stack: builds the single `tix` image from this checkout and runs it
# with PostgreSQL and Redis. (Production uses docker/deploy/docker-compose.yml with the published image.)
#
#   cp docker/dev.env.example .env   # then fill in the secrets (see comments in that file)
#   docker compose up -d --build
#   docker compose run --rm tix create-admin --email you@example.org --name "Your Name"
#   open http://localhost:8080
#
# `pnpm infra:up` starts only the data services for local development (`pnpm dev`): PostgreSQL,
# Redis and MinIO are bound to 127.0.0.1. MinIO (+ bucket setup) belongs to the profile
# `dev-storage`: the `tix` container itself keeps its files in the volume `tix-data`.

name: ${COMPOSE_PROJECT_NAME:-tix}

services:
  tix:
    image: ${IMAGE_REGISTRY:-tix}/tix:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public URL as seen by browsers.
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      DB_USER: ${POSTGRES_USER:-tix}
      DB_NAME: ${POSTGRES_DB:-tix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-tix}
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:?set APP_ENCRYPTION_KEYS in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WEB_DATABASE_POOL_MAX: ${WEB_DATABASE_POOL_MAX:-}
      TIX_WEB_PROCESSES: ${TIX_WEB_PROCESSES:-}
      TIX_DB_CONNECTION_BUDGET: ${TIX_DB_CONNECTION_BUDGET:-}
      WORKER_DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-}
      TIX_CHANNEL: ${TIX_CHANNEL:-}
      TIX_COMPOSE_VERSION: dev
      TIX_UPDATE_REPOSITORY: ${TIX_UPDATE_REPOSITORY:-}
      # Opt-in switches of the image (empty = default). Dev only: this file passes variables one by one, a .env
      # entry alone does not reach the container.
      TIX_ALLOW_FOREIGN_BACKUP_KEYS: ${TIX_ALLOW_FOREIGN_BACKUP_KEYS:-}
      TIX_ALLOWED_HOSTS: ${TIX_ALLOWED_HOSTS:-}
    ports:
      - ${HTTP_PORT:-8080}:8080
    volumes:
      - tix-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tix}
      TZ: UTC
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200} -c shared_buffers=256MB -c log_lock_waits=on -c deadlock_timeout=1s -c log_min_duration_statement=500 -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0
    # PostgreSQL 18 images keep PGDATA in a versioned sub-directory of this mount point.
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Local development keeps the password (REDIS_URL in docker/dev.env.example carries it) and the full
  # settings of docker/redis/redis.conf.
  redis:
    image: redis:8.10-alpine
    # >= 8.4 is required for aof-load-corrupt-tail-max-size. Never lower the tag of a volume that ran.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for local development and for testing the S3 driver (docs/STORAGE.md).
  # Credentials come straight from .env (MINIO_ROOT_*, S3_*).
  minio:
    profiles: [dev-storage]
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:${MINIO_API_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: buckets, least-privilege application user and policy (docker/minio/init.sh).
  minio-init:
    profiles: [dev-storage]
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-10-26T00-00-00Z}
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/init.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-tix-assets}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-tix-documents}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-tix-backups}
    volumes:
      - ./docker/minio:/init:ro

volumes:
  tix-data:
  postgres-data:
  redis-data:
  minio-data:
